[paths]
workspace_root = "D:/CodexForge/worktrees"
data_root = "E:/CodexData"
repository_root = "D:/CodexForge/repositories"
inbox_root = "E:/CodexData/inbox"
database_path = "E:/CodexData/forge.db"
evidence_root = "E:/CodexData/evidence"
knowledge_root = "E:/CodexData/knowledge"

[codex]
executable = "codex"
sandbox = "danger-full-access"
approval_policy = "never"
extra_args = []
disabled_features = ["apps", "browser_use", "browser_use_external", "goals", "image_generation", "memories", "multi_agent", "plugins", "skill_search"]

[models]
implementation = "gpt-5.6-terra"
review = "gpt-5.6-terra"
escalation = "gpt-5.6-sol"

[reasoning]
implementation = "medium"
review = "medium"
escalation = "high"

[workers]
# Start at 2. Raise to 4 after observing CPU, disk, and rate-limit behavior.
max_parallel = 2
poll_seconds = 15

[limits]
task_timeout_minutes = 180
max_repair_cycles = 2
max_identical_failures = 2
max_task_tokens = 2000000
max_output_chars = 12000
