[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-forge"
version = "0.2.0"
description = "Autonomous, zero-prompt Codex engineering controller for isolated Windows VPS environments."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Codex Forge"}]
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
# Telemetry is opt-in and inert unless `[telemetry] enabled = true`, so the tracing SDK is an
# extra rather than a runtime dependency. Without it installed, Forge runs exactly as before.
telemetry = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2",
]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1", "codex-forge[telemetry]"]

[project.scripts]
forge = "codex_forge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
