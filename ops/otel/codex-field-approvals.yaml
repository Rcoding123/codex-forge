#
# `expected: true` means the contract requires this field, so a run that does not produce it is
# reported rather than quietly passed. Seven entries carry it: the two resource attributes every
# codex-cli process sets, on both signals, and the top-level `codex exec` span with the two
# correlation attributes section 4 of the contract requires on it. The rest are approved *if they
# appear* -- a session that never opens a database does not owe anyone a `codex.sqlite.init.count`,
# and the blocked entries were observed by somebody who does not want them back.
#
# Constraints are the shape the approval covers. An APPROVED field observed outside its declared
# types, value classes, kinds, status codes, data types, temporalities, monotonicity, unit classes,
# or description classes is reported UNAPPROVED -- the approval described a field, not a wildcard.
