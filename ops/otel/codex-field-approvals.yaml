# Gate 8 approval manifest for codex-cli 0.146.0 under OpenTelemetry Collector 0.158.0.
#
# This file records what a **human** has approved about the Codex telemetry surface. The
# observation it was approved against is `tests/otel_codex_evidence.py`, distilled from the
# successful Gate 7 run `codex-final-20260807-121944` of 2026-08-07; the two are separate files on purpose,
# because an observation that edits its own approval is not an approval.
#
# It is the Codex twin of `ops/otel/claude-field-approvals.yaml` and shares its reader, its
# classifier, its safe-identifier policy, and its four statuses -- `tests/otel_inventory.py`, which
# Gate 6 built. `schema` differs so neither manifest can be loaded in the other's place.
#
#   APPROVED   a human reviewed this field and is content for it to be exported and reported.
#   BLOCKED    the field is refused. It is not approved whatever else changes.
#   REDACTED   `transform/privacy` deletes this key. Observing it is a Gate 8 failure.
#   UNAPPROVED not yet reviewed, or reviewed and rejected. Observing it fails the Gate 8 verdict.
#
# ## What the 2026-08-07 review approved
#
# 381 fields were observed after redaction. 372 are approved and 9 are blocked.
# Nothing was approved that the run did not produce, and nothing the run produced is left
# undecided: an observed field with no entry below is reported UNKNOWN, which fails the verdict.
#
# Approved, in one sentence: names and shapes. Span names, metric names, scope names, two resource
# attributes, Forge's two correlation attributes, and two token counters -- every one of them
# ordinary local-safe telemetry metadata about *which* step ran, not *what* it ran on. No prompt,
# response, identity, path, URL, secret, raw identifier, link, exemplar, or log record survived the
# pipeline to be reviewed, and the logs signal was never enabled: `otel.exporter` is pinned to
# `none` and the Collector declares no logs pipeline.
#
# Blocked, and the one finding of this review: **every Codex span event**. Codex 0.146.0 names an
# event after the Rust source location that emitted it -- a relative source path, a space, and a
# colon. An event name is not an attribute, so the `keep_keys` allowlist cannot reach it, and
# Collector 0.158.0 offers no processor that can rewrite it. It is refused. A Codex telemetry slice
# enabled later must drop span events at the Collector or leave this gate's finding standing.
#
# ## Two things this approval deliberately does not do
#
#   * **It does not make Codex token metrics authoritative.** `codex.turn.token_usage` and the two
#     `gen_ai.usage.*` span attributes are observational. Forge persisted usage remains the
#     authoritative basis for accounting, budgets, retries, and task state, nothing reads these,
#     and a token count on a span is one request's self-report -- not a bill and not a balance.
#   * **It does not enable anything.** Native Codex telemetry stays disabled outside the canary
#     harness, `CodexRunner` emits no `-c otel` override, and no production module imports the
#     builders. Approving a field is not turning on the exporter that would carry it.
#
# ## `vocabulary` is not approval, and one place where it matters
#
# `vocabulary` records the identifiers this repository knows; `status` is what approves. They are
# separate axes. Membership does, however, decide printability for an identifier that the
# safe-identifier policy in `tests/otel_inventory.py` would otherwise refuse, and sixteen names
# below are there for exactly that reason:
#
#   * ten span names and six metric names trip the *content-bearing word* check on `prompt` or
#     `response`, or the *conservative grammar* check on a `/`. They are Rust function and route
#     names -- `build_prompt`, `handle_responses`, `thread/start`,
#     `codex.responses_api_overhead.duration_ms` -- naming code, not carrying content.
#
# That override is bounded and tested: `tests/test_otel_codex_field_inventory.py` asserts every
# name in this vocabulary is plain ASCII with no whitespace, backslash, colon, `@`, `=`, or `?`, so
# vocabulary membership can never readmit a path, a URL, an address, or a credential. The seven
# Codex event names are the proof it bites -- they are refused, and `event_names` is empty.

schema: forge.codex.field-approvals/1
