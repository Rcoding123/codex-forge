# description are values, not identifiers, and are allowlisted under the pseudo-keys
# `metric.unit` and `metric.description`: a safe metric name buys the prose beneath it
# nothing. All four below were read out of the 2026-08-07 Collector log.
static_values:
  service.name:
    - codex_exec
  forge.telemetry.contract.version:
    - "1.0"
  metric.unit:
    - ms
  metric.description:
    # codex-cli 0.146.0. Instrument documentation, carrying nothing about a session.
    - "Duration in milliseconds."
    # Forge's own count connectors.
    - "spans named outside the diagnostic vocabulary, counted accepted"
    - "spans named outside the diagnostic vocabulary, counted exported"

