# Gate 6 approval manifest for Claude Code 2.1.223 under OpenTelemetry Collector 0.158.0.
#
# This file records what a **human** has approved. It is not, and must never become, a record of
# what a run observed -- that is the inventory report, written by `tests/otel_inventory.py` into
# an output directory of its own. Keeping the two apart is the point: an observation that edits
# its own approval is not an approval.
#
# A reviewer works here and nowhere else. Nothing in this file is executable, and approving a
# field never means editing test logic: no test asserts that a field carries a particular status.
# The rules the tests do enforce are consistency rules a real review satisfies on its way past --
# `review.approved_by` and `review.state` must agree, and an APPROVED field requires a named
# reviewer -- plus the two the contract fixes: `claude_code.llm_request` stays BLOCKED under
# Collector 0.158.0, and no key on the minimum deletion set may be allowlisted for printing.
#
# ## How a review works
#
# A run writes three files: `inventory-report.json`, `inventory-report.md`, and
# `candidate-manifest.yaml`. The last one proposes, in copy-and-paste form, exactly the additions
# below that the run needs -- vocabulary entries and UNAPPROVED field entries. Merge them, decide
# each one, set `review.approved_by` and `review.state: approved`, and re-run. **No inspection of
# the raw Collector log is required to review a schema identifier**, because every identifier that
# can be printed safely is printed in full in the report and in the candidate manifest.
#
# ## Two independent axes, which are easy to confuse
#
#   * `vocabulary` records the schema identifiers this repository already knows -- attribute
#     keys, scope names, span names, event names, metric names. Membership means `KNOWN` rather
#     than `UNKNOWN_SAFE` in a report. It is *not* approval, and it is *not* what decides whether
#     an identifier may be printed: an unknown identifier is printed in full whenever it passes
#     the safe-identifier policy in tests/otel_inventory.py.
#   * `status` on a field decides whether it is **approved**. Every entry below ships UNAPPROVED.
#
# `static_values` and `enum_values` are a different thing again: they are the only values that may
# be reproduced verbatim in a report. A metric's unit and description are **values**, listed under
# the pseudo-keys `metric.unit` and `metric.description`. A safe metric *name* buys the prose
# beneath it nothing.
#
# ## The four statuses
#
#   APPROVED   a human reviewed this field and is content for it to be exported and reported.
#   BLOCKED    the pipeline refuses this field's carrier. Observing it is a Gate 6 failure.
#   REDACTED   `transform/privacy` deletes this key. Observing it is a Gate 6 failure.
#   UNAPPROVED not yet reviewed, or reviewed and rejected. Observing it fails the Gate 6 verdict.
#
# ## Review of 2026-08-06
#
# `human-operator` reviewed the supervised, local-only canary in
# `claude-inventory-20260806-165526` -- 29 fields observed, no span link, no metric exemplar, no
# redacted key surviving, span accounting balanced, both processes exiting 0 -- and approved the 29
# fields it observed. Nothing else was approved: every entry this repository has never seen through
# the pipeline is still UNAPPROVED, on purpose, because an approval is evidence-backed or it is
# nothing.
#
# Two values were read out of that run's Collector log and allowlisted under `static_values` so the
# four Claude metrics could classify: their units (`USD`, `tokens`, `s`) and their descriptions.
# They are vendor-authored constants describing an instrument, not telemetry about a session.
#
# What the review did **not** approve: `claude_code.llm_request` and the request-level trace
# attribution that rides on it stay BLOCKED; every key on `redacted_keys` -- identities, prompts,
# responses, tool input and output, paths, URLs, exceptions, repository refs -- stays deleted by
# `transform/privacy`; span links and metric exemplars remain unapprovable by construction; and no
# raw dynamic value became printable because its key was approved. An approved key still reports a
# *class*, and only `static_values`/`enum_values` widen that.

schema: forge.claude.field-approvals/1
version: 0.3.0

subject:
  agent: claude-code
  agent_version: 2.1.223
  collector_version: 0.158.0
  contract_version: "1.0"

# Filled in by the human who reviews an observed inventory. Until both are set, no run passes.
review:
  approved_by: human-operator
  state: approved
  reviewed_on: "2026-08-06"

vocabulary:
  # The Collector's own `keep_keys` allowlist, the contract's minimum deletion set, and the
  # unknown-key sentinels the Gate 3 hostile payloads inject.
  attribute_keys:
    - service.name
    - service.version
    - deployment.environment
    - forge.telemetry.contract.version
    - forge.invocation.id
    - forge.task.id
    - forge.project.id
    - forge.task.risk
    - forge.task.max_attempts
    - forge.task.outcome
    - forge.attempt.number
    - forge.attempt.kind
    - forge.attempt.outcome
    - forge.attempt.terminated_by
    - forge.retry.bucket
    - forge.phase.name
    - forge.phase.cycle
    - forge.phase.outcome
    - forge.phase.duration_ms
    - forge.agent.role
    - gen_ai.request.model
    - gen_ai.request.reasoning_effort
    - gen_ai.usage.input_tokens
    - gen_ai.usage.cached_input_tokens
    - gen_ai.usage.output_tokens
    - gen_ai.usage.reasoning_tokens
    - gen_ai.token.type
    - forge.usage.fresh_input_tokens
    - forge.usage.raw_total_tokens
    - forge.usage.cache_hit_ratio
    - forge.usage.accounting_basis
    - forge.usage.budget_basis
    - forge.usage.token_type
    - error.type
    - error.code
    - user.email
    - organization.id
    - user.id
    - user.account_uuid
    - user.account_id
    - session.id
    - ccr.session.id
    - workspace.host_paths
    - user_prompt
    - system_prompt
    - system_prompt_preview
    - user_system_prompt
    - assistant_response
    - response
    - tool_input
    - tool_parameters
    - tool_output
    - payload
    - content
    - error
    - error.message
    - url.full
    - url.query
    - app.workspace.root
    - claude.prompt.v3
    - code.snippet
    - codex.turn.agent_message
    - exception.message
    - exception.stacktrace
    - forge.review.findings
    - forge.validation.stdout
    - gen_ai.completion.0.content
    - gen_ai.prompt.0.content
    - http.request.header.authorization
    - process.command_line
    - process.environment
    - vcs.ref.head.name
    - vcs.ref.head.revision
    - vcs.repository.url
  # The bounded span-name vocabulary from tests/otel_certification.py.
  span_names:
    - forge.task
    - forge.attempt
    - forge.phase
    - claude_code.interaction
    - claude_code.llm_request
    - claude_code.tool
    - claude_code.tool.execution
    - claude_code.subagent.spawn
    - claude_code.hook
    - claude_code.compaction
  # Empty on purpose. No Claude span-event name has been observed or written down. An event name
  # a run produces is reported in full when it is safe, so a reviewer can add it from the
  # candidate manifest without reading a log.
  event_names: []
  # The diagnostic counters this harness itself emits, and -- since the 2026-08-06 canary -- the
  # four Claude instruments it actually reported. Nothing here is guessed: every `claude_code.*`
  # name below was printed in full by that run, which is what the safe-identifier policy is for.
  metric_names:
    - claude_code.active_time.total
    - claude_code.cost.usage
    - claude_code.session.count
    - claude_code.token.usage
    - forge.diagnostic.span.accepted.forge_task
    - forge.diagnostic.span.accepted.forge_attempt
    - forge.diagnostic.span.accepted.forge_phase
    - forge.diagnostic.span.accepted.claude_code_interaction
    - forge.diagnostic.span.accepted.claude_code_llm_request
    - forge.diagnostic.span.accepted.claude_code_tool
    - forge.diagnostic.span.accepted.claude_code_tool_execution
    - forge.diagnostic.span.accepted.claude_code_subagent_spawn
    - forge.diagnostic.span.accepted.claude_code_hook
    - forge.diagnostic.span.accepted.claude_code_compaction
    - forge.diagnostic.span.accepted.other
    - forge.diagnostic.span.exported.forge_task
    - forge.diagnostic.span.exported.forge_attempt
    - forge.diagnostic.span.exported.forge_phase
    - forge.diagnostic.span.exported.claude_code_interaction
    - forge.diagnostic.span.exported.claude_code_llm_request
    - forge.diagnostic.span.exported.claude_code_tool
    - forge.diagnostic.span.exported.claude_code_tool_execution
    - forge.diagnostic.span.exported.claude_code_subagent_spawn
    - forge.diagnostic.span.exported.claude_code_hook
    - forge.diagnostic.span.exported.claude_code_compaction
    - forge.diagnostic.span.exported.other
  scope_names:
    - github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector
    - forge.certification
    # Claude Code's own two scopes, observed on 2026-08-06: one per signal.
    - com.anthropic.claude_code
    - com.anthropic.claude_code.tracing

# The only values that may be reproduced verbatim in a report. Everything else is reduced to a
# bounded class. A value that is not listed here for its key is never printed, whatever it is.
static_values:
  service.name:
    - claude-code
    - codex-forge
  deployment.environment:
    - local
  forge.telemetry.contract.version:
    - "1.0"
  # Metric units and descriptions are values, not identifiers. These are the ones this
  # repository produces, plus -- read out of the 2026-08-06 run's Collector log and allowlisted
  # deliberately -- the ones Claude Code's four instruments carry. A vendor's prose is printed
  # only once a human has put it here, which is what the entries under `Claude Code` are.
  metric.unit:
    - "{token}"
    - ms
    # Claude Code 2.1.223.
    - USD
    - tokens
    - s
  metric.description:
    # Claude Code 2.1.223. Instrument documentation, carrying nothing about a session.
    - "Count of CLI sessions started"
    - "Cost of the Claude Code session"
    - "Number of tokens used"
    - "Total active time in seconds"
    - "spans named forge.task, counted accepted"
    - "spans named forge.attempt, counted accepted"
    - "spans named forge.phase, counted accepted"
    - "spans named claude_code.interaction, counted accepted"
    - "spans named claude_code.llm_request, counted accepted"
    - "spans named claude_code.tool, counted accepted"
    - "spans named claude_code.tool.execution, counted accepted"
    - "spans named claude_code.subagent.spawn, counted accepted"
    - "spans named claude_code.hook, counted accepted"
    - "spans named claude_code.compaction, counted accepted"
    - "spans named outside the diagnostic vocabulary, counted accepted"
    - "spans named forge.task, counted exported"
    - "spans named forge.attempt, counted exported"
    - "spans named forge.phase, counted exported"
    - "spans named claude_code.interaction, counted exported"
    - "spans named claude_code.llm_request, counted exported"
    - "spans named claude_code.tool, counted exported"
    - "spans named claude_code.tool.execution, counted exported"
    - "spans named claude_code.subagent.spawn, counted exported"
    - "spans named claude_code.hook, counted exported"
    - "spans named claude_code.compaction, counted exported"
    - "spans named outside the diagnostic vocabulary, counted exported"

# Bounded enumerations whose members may be printed. Kept separate from `static_values` so a
# reviewer can tell a fixed constant from a small closed set.
enum_values:
  forge.agent.role:
    - implementer
    - reviewer
    - validator
  gen_ai.token.type:
    - input
    - output

# Keys `transform/privacy` is required to delete, on every surface of both signals. Declared by
# key rather than per surface: redaction is a property of the key, and a per-surface list is a
# list somebody forgets to extend. Observing any of these post-privacy is a Gate 6 failure.
redacted_keys:
  - user.email
  - organization.id
  - user.id
  - user.account_uuid
  - user.account_id
  - session.id
  - ccr.session.id
  - workspace.host_paths
  - user_prompt
  - system_prompt
  - system_prompt_preview
  - user_system_prompt
  - assistant_response
  - response
  - tool_input
  - tool_parameters
  - tool_output
  - payload
  - content
  - error
  - error.message
  - url.full
  - url.query
  - app.workspace.root
  - claude.prompt.v3
  - code.snippet
  - codex.turn.agent_message
  - exception.message
  - exception.stacktrace
  - forge.review.findings
  - forge.validation.stdout
  - gen_ai.completion.0.content
  - gen_ai.prompt.0.content
  - http.request.header.authorization
  - process.command_line
  - process.environment
  - vcs.ref.head.name
  - vcs.ref.head.revision
  - vcs.repository.url

# ---------------------------------------------------------------------------------------------
# Reviewable fields
# ---------------------------------------------------------------------------------------------
#
# `expected: true` means the contract says this field must be there. It is reported when a run
# does not produce it, rather than being quietly treated as approved-and-absent.
#
# An observed field with no entry below is reported UNKNOWN, which fails the verdict, and appears
# in that run's `candidate-manifest.yaml` ready to be pasted in here.
fields:

  # -- Correlation, contract section 4 ---------------------------------------------------------
  # Both reach the child through OTEL_RESOURCE_ATTRIBUTES and nothing else sets them.
  - id: resource.attribute/traces/forge.invocation.id
    status: APPROVED
    expected: true
    types: [Str]
    value_classes: [lowercase-hex-32]
    note: >-
      Gate 5 observed a Claude trace resource, so this must appear. Approved 2026-08-06: Forge's
      own correlation handle, minted per invocation and carried in on OTEL_RESOURCE_ATTRIBUTES.
      The id itself is never printed -- only its shape.
  - id: resource.attribute/traces/forge.telemetry.contract.version
    status: APPROVED
    expected: true
    types: [Str]
    value_classes: [approved-static-string]
    note: >-
      The pinned contract version, allowlisted so the exact string is printed. Approved
      2026-08-06: a constant this repository sets, observed as "1.0".
  - id: resource.attribute/metrics/forge.invocation.id
    status: APPROVED
    expected: true
    types: [Str]
    value_classes: [lowercase-hex-32]
    note: >-
      Approved 2026-08-06, and expected from the same date: the canary reported four Claude
      metrics, so the metric resource must carry the correlation handle too.
  - id: resource.attribute/metrics/forge.telemetry.contract.version
    status: APPROVED
    expected: true
    types: [Str]
    value_classes: [approved-static-string]
    note: >-
      The pinned contract version, allowlisted so the exact string is printed. Approved and
      expected from 2026-08-06, for the same reason as its metrics-side neighbour.

  # -- Claude's own resource identity ----------------------------------------------------------
  # Observed on both signals on 2026-08-06 and approved there. `service.name` is pinned to the one
  # allowlisted string; a value that is not it classes as `unclassifiable`, which no approval
  # covers, so this stays an approval of a constant rather than of whatever the field may carry.
  - id: resource.attribute/traces/service.name
    status: APPROVED
    types: [Str]
    value_classes: [approved-static-string]
    note: >-
      Approved 2026-08-06. The run showed the exact value, "claude-code".
  - id: resource.attribute/traces/service.version
    status: APPROVED
    types: [Str]
    value_classes: [semantic-version]
    note: >-
      Approved 2026-08-06. The version itself is never printed; only its shape is.
  - id: resource.attribute/metrics/service.name
    status: APPROVED
    types: [Str]
    value_classes: [approved-static-string]
    note: >-
      Approved 2026-08-06. The run showed the exact value, "claude-code".
  - id: resource.attribute/metrics/service.version
    status: APPROVED
    types: [Str]
    value_classes: [semantic-version]
    note: >-
      Approved 2026-08-06. The version itself is never printed; only its shape is.

  # -- Spans -----------------------------------------------------------------------------------
  - id: span/claude_code.interaction
    status: APPROVED
    expected: true
    kinds: [Internal, Client, Server]
    status_codes: [Unset, Ok, Error]
    note: >-
      The one Claude span the Gate 5 canary exported. Its fields are what Gate 6 is about.
      Approved 2026-08-06 as an Internal/Unset span carrying the two correlation attributes below
      and nothing else. Approving the span approves its shape, not its contents: a link on one of
      these is unapprovable by construction, and any attribute key not listed below is UNKNOWN.
  - id: span/claude_code.llm_request
    status: BLOCKED
    note: >-
      Claude Code 2.1.223 attaches span links to these, and filter/unredactable drops any span
      carrying a link because no Collector 0.158.0 processor can empty a link attribute map.
      Request-level trace attribution is BLOCKED, not pending. Observing one of these after the
      privacy pipeline means the filter did not run. Reaffirmed 2026-08-06: the canary produced
      two of them, the filter dropped both, and the review did not reopen the question.

  # -- Span attributes -------------------------------------------------------------------------
  # Everything that survived on the one exported Claude span. Both are Forge's own correlation
  # attributes, set on the resource and copied down; Claude contributed no attribute of its own
  # that reached the inventory.
  - id: span.attribute/claude_code.interaction/forge.invocation.id
    status: APPROVED
    types: [Str]
    value_classes: [lowercase-hex-32]
    note: >-
      Approved 2026-08-06. The correlation handle, reported by shape and never by value.
  - id: span.attribute/claude_code.interaction/forge.telemetry.contract.version
    status: APPROVED
    types: [Str]
    value_classes: [approved-static-string]
    note: >-
      Approved 2026-08-06. The pinned contract constant, observed as "1.0".
  - id: span/claude_code.tool
    status: UNAPPROVED
    kinds: [Internal, Client, Server]
    status_codes: [Unset, Ok, Error]
    note: >-
      Candidate. A tool-disabled one-turn canary should not produce this span at all.
  - id: span/claude_code.tool.execution
    status: UNAPPROVED
    kinds: [Internal, Client, Server]
    status_codes: [Unset, Ok, Error]
    note: >-
      Candidate. A tool-disabled one-turn canary should not produce this span at all.
  - id: span/claude_code.subagent.spawn
    status: UNAPPROVED
    kinds: [Internal, Client, Server]
    status_codes: [Unset, Ok, Error]
    note: >-
      Candidate. A tool-disabled one-turn canary should not produce this span at all.
  - id: span/claude_code.hook
    status: UNAPPROVED
    kinds: [Internal, Client, Server]
    status_codes: [Unset, Ok, Error]
    note: >-
      Candidate. A tool-disabled one-turn canary should not produce this span at all.
  - id: span/claude_code.compaction
    status: UNAPPROVED
    kinds: [Internal, Client, Server]
    status_codes: [Unset, Ok, Error]
    note: >-
      Candidate. A tool-disabled one-turn canary should not produce this span at all.
  - id: span/forge.task
    status: UNAPPROVED
    kinds: [Internal]
    status_codes: [Unset, Ok, Error]
    note: >-
      Forge's own span. A Claude-only inventory run emits none; the Gate 3 synthetic payloads
      do, which is how the harness is tested.
  - id: span/forge.attempt
    status: UNAPPROVED
    kinds: [Internal]
    status_codes: [Unset, Ok, Error]
    note: >-
      Forge's own span. A Claude-only inventory run emits none; the Gate 3 synthetic payloads
      do, which is how the harness is tested.
  - id: span/forge.phase
    status: UNAPPROVED
    kinds: [Internal]
    status_codes: [Unset, Ok, Error]
    note: >-
      Forge's own span. A Claude-only inventory run emits none; the Gate 3 synthetic payloads
      do, which is how the harness is tested.

  # -- Instrumentation scopes ------------------------------------------------------------------
  - id: scope/metrics/github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector
    status: APPROVED
    version_classes: [absent]
    note: >-
      The bounded span-name diagnostic's own count connector. Its records are counted separately
      in the report's `carriers` block and carry no attribute of any kind. Approved 2026-08-06.
  - id: scope/traces/com.anthropic.claude_code.tracing
    status: APPROVED
    version_classes: [semantic-version]
    note: >-
      Claude Code's trace instrumentation scope, observed 2026-08-06. A scope name and a version
      shape; it carried no scope attribute, and an attribute appearing here later is UNKNOWN.
  - id: scope/metrics/com.anthropic.claude_code
    status: APPROVED
    version_classes: [semantic-version]
    note: >-
      Claude Code's metric instrumentation scope, observed 2026-08-06. Same reasoning as its
      trace-side counterpart.
  - id: scope/traces/forge.certification
    status: UNAPPROVED
    version_classes: [semantic-version, nonnegative-double, absent]
    note: >-
      The synthetic Gate 3 payload scope. Never produced by a real agent.
  - id: scope/metrics/forge.certification
    status: UNAPPROVED
    version_classes: [semantic-version, nonnegative-double, absent]
    note: >-
      The synthetic Gate 3 payload scope. Never produced by a real agent.

  # -- The diagnostic counters -----------------------------------------------------------------
  # This harness's own instrument, not Claude's. Inventoried anyway: a field that is not reported
  # because somebody decided it was ours is a field nobody reviewed. The unit is empty and the
  # description is allowlisted above, so both classify without anything vendor-written leaking.
  - id: metric/forge.diagnostic.span.accepted.forge_task
    status: UNAPPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/forge.diagnostic.span.accepted.forge_attempt
    status: UNAPPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/forge.diagnostic.span.accepted.forge_phase
    status: UNAPPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/forge.diagnostic.span.accepted.claude_code_interaction
    status: APPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/forge.diagnostic.span.accepted.claude_code_llm_request
    status: APPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
    note: >-
      Approved 2026-08-06, and not in tension with `span/claude_code.llm_request` staying BLOCKED.
      This is a count of spans the receiver accepted before `filter/unredactable` dropped them --
      the evidence that the block fired. It carries no attribute, and so no attribution.
  - id: metric/forge.diagnostic.span.accepted.claude_code_tool
    status: UNAPPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/forge.diagnostic.span.accepted.claude_code_tool_execution
    status: UNAPPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/forge.diagnostic.span.accepted.claude_code_subagent_spawn
    status: UNAPPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
