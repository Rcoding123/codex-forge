  # -- Claude's own instruments ----------------------------------------------------------------
  # The four metrics the 2026-08-06 canary reported, approved there. Each is a monotonic delta sum
  # of aggregate usage: how many sessions, how many tokens, how much money, how much wall clock.
  # None of them is content, and none of them names anything -- a model, a tool, a file -- because
  # no attribute beyond the two correlation keys below reached the inventory. Their units and
  # descriptions are allowlisted in `static_values`; without that they class as `unclassifiable`,
  # and the harness refuses to approve an unclassifiable value however this file is edited.
  - id: metric/claude_code.session.count
    status: APPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/claude_code.token.usage
    status: APPROVED
    unit_classes: [approved-static-string]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/claude_code.cost.usage
    status: APPROVED
    unit_classes: [approved-static-string]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/claude_code.active_time.total
    status: APPROVED
    unit_classes: [approved-static-string]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]

  # -- Metric data-point attributes ------------------------------------------------------------
  # Written out per instrument rather than per key, so that a key appearing on an instrument
  # nobody reviewed is UNKNOWN rather than quietly covered. Both keys are Forge's own; Claude's
  # documented data-point attributes -- session id, account, model, terminal type -- are on
  # `redacted_keys` or absent, and none of them survived to be inventoried.
  - id: metric.datapoint.attribute/claude_code.session.count/forge.invocation.id
    status: APPROVED
    types: [Str]
    value_classes: [lowercase-hex-32]
  - id: metric.datapoint.attribute/claude_code.session.count/forge.telemetry.contract.version
