    monotonicity: [true]
  - id: metric/forge.diagnostic.span.accepted.other
    status: UNAPPROVED
    unit_classes: [absent]
    description_classes: [approved-static-string]
    data_types: [Sum]
    aggregation_temporalities: [Delta]
    monotonicity: [true]
  - id: metric/forge.diagnostic.span.exported.forge_task
    status: UNAPPROVED
