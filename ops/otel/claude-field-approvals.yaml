# The Gate 3 synthetic payloads also carry two metrics of their own,
# `forge.certification.token.usage` and `forge.certification.phase.duration`. They are
# deliberately absent from the vocabulary and from this list: a run that reports them by name,
# marks them UNKNOWN, and proposes them in its candidate manifest is the harness demonstrating
# exactly the review path a real Claude field will take.
